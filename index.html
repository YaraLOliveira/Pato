<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patinho de bolso 🐥</title><style>
:root{color-scheme:dark;--bg:#252252;--gold:#f6d395;--ink:#241b45}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--bg);color:#fff2cd;font-family:ui-monospace,Consolas,monospace;display:grid;place-items:center;overflow-x:hidden}main{width:min(100%,600px);padding:24px 18px 34px;text-align:center}h1{font-size:clamp(19px,4vw,26px);letter-spacing:1px;margin:0 0 9px;text-shadow:3px 3px #17143d}.sub{color:#c7c3ed;font-size:12px;margin:0 0 18px}.scene{position:relative;min-height:360px;display:grid;place-items:center;isolation:isolate}.halo{position:absolute;width:255px;height:255px;border-radius:50%;background:#49417a55;filter:blur(35px);z-index:-1}canvas{width:min(76vw,330px);height:min(76vw,330px);image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 13px 0 #17153b77);cursor:pointer;touch-action:manipulation}canvas.bounce{animation:bounce .42s steps(4,end)}@keyframes bounce{50%{transform:translateY(-15px) rotate(-3deg)}}.speech{min-height:55px;display:grid;place-items:center;margin:0 auto 18px;max-width:470px;background:#fff2cd;color:#34274e;border:4px solid #17143d;box-shadow:5px 5px 0 #17143d;padding:9px 13px;font-size:13px;line-height:1.45}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.actions button,.restart{font:700 12px ui-monospace,Consolas,monospace;border:3px solid #17143d;background:#f6d395;color:#34274e;padding:13px 5px;box-shadow:4px 4px 0 #17143d;cursor:pointer;transition:transform .1s,box-shadow .1s}.actions button:nth-child(2){background:#b9d9dd}.actions button:nth-child(3){background:#f4b9d1}.actions button:hover,.actions button:focus-visible,.restart:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 #17143d}.actions button:active{transform:translate(4px,4px);box-shadow:none}.footer{font-size:11px;color:#b6afe4;margin:20px 0 0}.hearts{pointer-events:none;position:absolute;inset:0;overflow:hidden}.particle{position:absolute;left:50%;top:58%;font-size:25px;animation:fly 1.4s ease-out forwards;--x:0px}@keyframes fly{to{transform:translate(var(--x),-175px) rotate(22deg);opacity:0}}.restart{margin-top:13px;background:#69618f;color:#fff4dc;padding:8px 14px;font-size:11px}@media(max-width:370px){.actions{gap:6px}.actions button{font-size:11px}.scene{min-height:300px}}
</style></head><body><main><h1>✦ PATINHO DE BOLSO ✦</h1><p class="sub">Escolhe um botão e vê o que acontece...</p><div class="scene"><div class="halo"></div><canvas id="duck" width="64" height="64" role="img" aria-label="Patinho amarelo em pixel art, que reage às suas escolhas" tabindex="0"></canvas><div class="hearts" id="particles"></div></div><div class="speech" id="speech" aria-live="polite">piu piu! 🐥 O que você quer fazer comigo?</div><div class="actions"><button type="button" data-act="love">💗 CORAÇÃO</button><button type="button" data-act="work">💼 TRABALHO</button><button type="button" data-act="flirt">😏 SAFADO</button></div><button class="restart" id="reset" type="button">↻ recomeçar</button><p class="footer">Dica: clica no próprio patinho também ♡</p></main><script>
const c=document.getElementById('duck'),ctx=c.getContext('2d'),speech=document.getElementById('speech'),particles=document.getElementById('particles');ctx.imageSmoothingEnabled=false;
const C={outline:'#d7ac4e',body:'#ffdea3',light:'#ffe8ba',shade:'#efc77c',beak:'#e9a43f',beak2:'#f6b34f',eye:'#592b29',pink:'#ee8b9c',white:'#fff5df',blue:'#8baeba',suit:'#566b91',dark:'#342b4d'};
let mood='idle',n=0,tick=0;const px=(x,y,w,h,color)=>{ctx.fillStyle=color;ctx.fillRect(x,y,w,h)},polygon=(points,color)=>{ctx.fillStyle=color;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()};
function duck(){ctx.clearRect(0,0,64,64);const bop=(tick%40<20)?0:1;ctx.save();ctx.translate(0,bop);
// Rounded, blocky body in the proportions of the reference image.
polygon([[28,7],[37,7],[37,8],[41,8],[41,10],[44,10],[44,12],[47,12],[47,15],[50,15],[50,19],[52,19],[52,24],[54,24],[54,28],[56,28],[56,38],[54,38],[54,42],[51,42],[51,48],[48,48],[48,53],[44,53],[44,56],[19,56],[19,54],[16,54],[16,50],[13,50],[13,46],[11,46],[11,41],[8,41],[8,32],[10,32],[10,28],[12,28],[12,24],[14,24],[14,20],[16,20],[16,17],[18,17],[18,14],[21,14],[21,11],[24,11],[24,9],[28,9]],C.outline);
polygon([[28,9],[37,9],[37,10],[41,10],[41,12],[44,12],[44,14],[47,14],[47,17],[49,17],[49,20],[51,20],[51,25],[53,25],[53,29],[54,29],[54,38],[51,38],[51,43],[49,43],[49,48],[46,48],[46,52],[43,52],[43,54],[21,54],[21,52],[18,52],[18,49],[16,49],[16,45],[13,45],[13,39],[10,39],[10,32],[12,32],[12,28],[14,28],[14,24],[16,24],[16,20],[18,20],[18,17],[21,17],[21,14],[24,14],[24,12],[28,12]],C.body);
polygon([[28,10],[37,10],[37,11],[40,11],[40,13],[43,13],[43,15],[45,15],[45,18],[48,18],[48,21],[50,21],[50,27],[52,27],[52,32],[49,29],[47,23],[43,18],[37,14],[28,13],[24,15],[21,18],[18,23],[15,31],[13,36],[12,32],[15,24],[19,18],[24,13]],C.light);
// side wings
polygon([[13,31],[12,34],[11,41],[13,42],[15,40],[17,36],[17,43],[18,46],[19,42],[18,35],[17,32]],C.shade);polygon([[49,31],[52,34],[54,37],[53,41],[51,41],[49,38],[47,35]],C.shade);polygon([[50,30],[53,34],[54,37],[53,39],[51,39],[49,35]],C.body);
// feet
px(20,54,9,2,C.shade);px(21,56,8,2,C.beak);px(38,54,8,2,C.shade);px(39,56,8,2,C.beak);
// changing expressions
if(mood==='love'){px(21,23,3,3,C.pink);px(24,24,2,3,C.pink);px(27,23,3,3,C.pink);px(23,26,5,2,C.pink);px(24,28,3,2,C.pink);px(38,23,3,3,C.pink);px(41,24,2,3,C.pink);px(44,23,3,3,C.pink);px(40,26,5,2,C.pink);px(41,28,3,2,C.pink);px(17,34,4,2,C.pink);px(46,34,4,2,C.pink)}
else if(mood==='flirt'){px(22,24,8,2,C.eye);px(23,26,5,1,C.eye);px(39,22,7,2,C.eye);px(39,24,5,1,C.eye);px(17,34,5,2,C.pink);px(46,34,5,2,C.pink)}
else if(mood==='work'){px(21,23,7,4,C.dark);px(39,23,7,4,C.dark);px(28,24,11,1,C.dark);px(22,24,5,1,C.white);px(40,24,5,1,C.white)}
else if(mood==='shy'){px(22,25,7,2,C.eye);px(39,25,7,2,C.eye);px(17,33,6,3,C.pink);px(46,33,6,3,C.pink)}
else{px(23,23,4,5,C.eye);px(40,23,4,5,C.eye)}
// beak
polygon([[29,27],[37,27],[37,28],[40,28],[40,32],[37,32],[37,34],[29,34],[29,32],[26,32],[26,29],[29,29]],C.outline);polygon([[29,29],[38,29],[38,31],[36,31],[36,33],[30,33],[30,31],[28,31],[28,30],[29,30]],C.beak2);
if(mood==='work'){px(28,34,12,3,C.suit);px(30,37,8,3,C.suit);px(32,35,4,7,C.dark);px(32,36,4,2,C.white);px(33,39,2,4,C.dark)}
if(mood==='flirt'){px(40,35,5,2,C.eye);px(42,37,4,2,C.eye);px(43,39,2,2,C.eye)}
if(mood==='love'){px(32,35,4,2,C.pink)}
ctx.restore()}
const lines={love:['Ai, meu coração de patinho! 💗','Você me deixou todo apaixonadinho! ♡','Piu... fica mais um pouquinho comigo? 🥹'],work:['Reunião às 9h? Eu sou só um patinho! 💼','Modo CLT ativado: piu piu e café ☕','Já subi o deploy. Agora quero milho. 👔'],flirt:['E esse olhar aí, hein? 😏','Piu piu... quer um beijo no biquinho? 💋','Hoje o patinho tá impossível! 🔥']};
function burst(symbol,count=7){for(let i=0;i<count;i++){let p=document.createElement('span');p.className='particle';p.textContent=symbol;p.style.setProperty('--x',((i-(count-1)/2)*34)+'px');p.style.animationDelay=(i*0.065)+'s';particles.append(p);p.addEventListener('animationend',()=>p.remove())}}
function react(type){mood=type;n++;speech.textContent=lines[type][(n-1)%lines[type].length];burst(type==='love'?'💗':type==='work'?'📄':'💋',type==='work'?4:7);c.classList.remove('bounce');void c.offsetWidth;c.classList.add('bounce');duck()}
document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>react(b.dataset.act)));c.addEventListener('click',()=>{mood='shy';speech.textContent='Hihi! Você fez cócegas no patinho! 🐥';burst('✨',5);duck()});c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();c.click()}});document.getElementById('reset').addEventListener('click',()=>{mood='idle';n=0;speech.textContent='piu piu! 🐥 O que você quer fazer comigo?';particles.replaceChildren();duck()});duck();setInterval(()=>{tick++;duck()},230);
</script></body></html>
